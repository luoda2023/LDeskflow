name: Build LDeskflow (Windows, macOS, Linux)

on:
  push:
    branches: [master]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_CONFIGURE: "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF"

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64

      - name: Install OpenSSL via vcpkg
        id: vcpkg
        uses: johnwason/vcpkg-action@v8
        with:
          pkgs: openssl
          extra-args: --classic --host-triplet=x64-windows-release
          triplet: x64-windows-release
          token: ${{ github.token }}
          revision: master

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          cache: true
          cache-key-prefix: windows-${{ runner.os }}-qt6101

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.Firewall.wixext/5.0.2

      - name: Configure
        run: ${{env.CMAKE_CONFIGURE}} -G Ninja ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}

      - name: Build package
        run: |
          cmake --build build -j8
          cmake --build build -j8 --target package
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== Packaging failed, dumping WiX log ==="
            $logs = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'build\_CPack_Packages') -Recurse -Filter 'wix.log' -ErrorAction SilentlyContinue
            foreach ($l in $logs) { Write-Host "--- $($l.FullName) ---"; Get-Content $l.FullName -Tail 200 }
            exit $LASTEXITCODE
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: LDeskflow-windows-x64
          path: ${{github.workspace}}/build/deskflow*.*
          if-no-files-found: error

  macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install OpenSSL
        run: brew install openssl --quiet

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          cache: true
          cache-key-prefix: macos-${{ runner.os }}-qt6101

      - name: Configure
        run: ${{env.CMAKE_CONFIGURE}} -DBUILD_OSX_BUNDLE=ON -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Build package
        run: |
          cmake --build build -j8
          cmake --build build --target package

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: LDeskflow-macos-arm64
          path: ${{github.workspace}}/build/deskflow*.*
          if-no-files-found: error

  linux-x64:
    name: Linux x64 (deb)
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 60
    steps:
      - name: Install git in container
        run: |
          apt-get update -qqq > /dev/null
          apt-get install -y -qqq git ca-certificates > /dev/null

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: |
          apt-get update -qqq > /dev/null
          apt-get install -y -qqq cmake build-essential ninja-build pkg-config dpkg-dev \
            xorg-dev libx11-dev libxtst-dev libssl-dev \
            libglib2.0-dev libxkbfile-dev qt6-base-dev qt6-tools-dev \
            libgtk-3-dev \
            libxkbcommon-dev libxkbregistry-dev \
            libei-dev libportal-dev help2man file -y > /dev/null

      - name: Configure
        run: ${{env.CMAKE_CONFIGURE}} -G Ninja -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build package
        run: cmake --build build --config Release -j8 --target package

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: LDeskflow-linux-x64
          path: ${{github.workspace}}/build/deskflow*.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows-x64, macos-arm64, linux-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List files
        run: find dist -type f | sort

      - name: Create Release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          name: LDeskflow ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/**/deskflow*.*
